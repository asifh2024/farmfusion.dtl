<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Error</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #202124;
      overflow: hidden;
    }

    .screen {
      text-align: center;
      transition: opacity .35s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    .icon {
      font-size: 72px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 34px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    p {
      color: #5f6368;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
      max-width: 420px;
    }

    button {
      border: none;
      background: #1a73e8;
      color: #fff;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1558b0;
    }

    .loader-screen {
      position: absolute;
      inset: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    .loader-screen.show {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #1a73e8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #5f6368;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="screen" id="errorScreen">

    <div class="icon">⚠️</div>

    <h1>Something went wrong</h1>

    <p>
      An unexpected error occurred. Please try again later.
    </p>

    <button onclick="retryPage()">
      Try again
    </button>

  </div>

  <div class="loader-screen" id="loader">

    <div class="spinner"></div>

    <div class="loading-text">
      Loading...
    </div>

  </div>

  <script>
    function retryPage() {

      const errorScreen = document.getElementById("errorScreen");
      const loader = document.getElementById("loader");

      errorScreen.classList.add("hidden");

      loader.classList.add("show");

      setTimeout(() => {

        loader.classList.remove("show");

        setTimeout(() => {
          errorScreen.classList.remove("hidden");
        }, 300);

      }, 2500);

    }
  </script>

</body>

</html>
